<!DOCTYPE html>

    <title>Sectores - Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button onclick="window.location.href='index.html'" class="btn-back">← Volver</button>
            <h1 id="eventName">Cargando evento...</h1>
            <div class="header-actions">

        <div class="venue-layout">

            <div class="sectors-grid" id="sectorsContainer">

            </div>
        </div>
