<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h2>🎫 Sistema de Eventos</h2>
            <p>Ingresá o creá una cuenta para continuar</p>
        </div>

        <div class="auth-body">
            <div class="tabs">
                <button type="button" class="tab active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button type="button" class="tab" onclick="switchTab('register')">Registrarse</button>
            </div>

            <!-- Formulario Login -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-input" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary">Entrar</button>
            </form>

            <!-- Formulario Registro -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label class="form-label" for="regName">Nombre completo</label>
                    <input type="text" id="regName" class="form-input" required placeholder="Juan Pérez">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="form-input" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" class="form-input" required placeholder="Mínimo 6 caracteres" minlength="4">
                </div>
                <button type="submit" id="regBtn" class="btn btn-primary">Crear cuenta</button>
            </form>

            <div id="messageBox" class="message"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
