<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asientos - Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button onclick="window.location.href='sectors.html?event='+new URLSearchParams(window.location.search).get('event')" class="btn-back">← Volver a Sectores</button>
            <div class="header-title-group">
                <h1 id="eventName">Evento</h1>
                <p class="sector-title" id="sectorName">Sector</p>
            </div>
            <div class="header-actions">
                <div class="user-info">
                    <span id="userName">Usuario</span>
                    <button onclick="logout()" class="btn btn-logout">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <div class="stage">  ESCENARIO</div>

        <div class="legend">
            <div class="legend-item"><div class="legend-seat available"></div><span>Disponible</span></div>
            <div class="legend-item"><div class="legend-seat reserved"></div><span>Reservado</span></div>
            <div class="legend-item"><div class="legend-seat sold"></div><span>Vendido</span></div>
        </div>

        <div id="seatsContainer" class="seats-layout">
            <div class="loading">Cargando asientos...</div>
        </div>

        <div id="messageBox" class="message"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/seats.js"></script>
</body>
</html>
